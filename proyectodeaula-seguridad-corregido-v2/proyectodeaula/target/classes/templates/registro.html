<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f5f5;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            width:500px;
            border:none;
            border-radius:25px;
            padding:40px;
            animation:fade 1s ease;
        }

        @keyframes fade{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0px);
            }

        }

    </style>

</head>
<body>

<div class="card shadow">

    <h1 class="text-center mb-4">

        📝 Registro

    </h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form method="post" th:action="@{/registrar}">

        <div class="mb-3">

            <label>Nombre</label>

            <input type="text"
                   class="form-control"
                   name="nombre">

        </div>

        <div class="mb-3">

            <label>Usuario</label>

            <input type="text"
                   class="form-control"
                   name="usuario">

        </div>

        <div class="mb-3">

            <label>Contraseña</label>

            <input type="password"
                   class="form-control"
                   name="password">

        </div>

        <div class="mb-3">

            <label>Rol</label>

            <select class="form-control"
                    name="rol">

                <option value="CIUDADANO">
                    Ciudadano
                </option>

                <option value="RECICLADOR">
                    Reciclador
                </option>

                <option value="ACOPIO">
                    Acopio
                </option>

            </select>

        </div>

        <button class="btn btn-success w-100">

            Registrarse

        </button>

    </form>

</div>

</body>
</html>
