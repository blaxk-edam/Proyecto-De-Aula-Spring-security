<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Acopio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f1f5f9;
        }

        .hero{
            background:linear-gradient(135deg,#0f172a,#1e293b);
            color:white;
            padding:50px;
            border-radius:30px;
        }

        .card{
            border:none;
            border-radius:25px;
            box-shadow:0 10px 25px rgba(0,0,0,0.1);
        }

        .tipo{
            background:white;
            border-radius:20px;
            padding:20px;
            text-align:center;
            font-weight:bold;
            transition:0.3s;
        }

        .tipo:hover{
            transform:scale(1.05);
            background:#0f172a;
            color:white;
        }

    </style>

</head>
<body>

<div class="container mt-4 d-flex justify-content-end">
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-outline-dark btn-sm">Cerrar sesión</button>
    </form>
</div>

<div class="container mt-5">

    <div class="hero mb-5">

        <h1>

            🏭 Centro de Acopio

        </h1>

        <p>

            Organización y clasificación de residuos reciclables.

        </p>

    </div>

    <div class="row mb-5">

        <div class="col-md-2">
            <div class="tipo">📄 PAPEL</div>
        </div>

        <div class="col-md-2">
            <div class="tipo">📦 CARTON</div>
        </div>

        <div class="col-md-2">
            <div class="tipo">🧴 PLASTICOS</div>
        </div>

        <div class="col-md-2">
            <div class="tipo">🔩 METALES</div>
        </div>

        <div class="col-md-2">
            <div class="tipo">🍾 VIDRIO</div>
        </div>

    </div>

    <div class="card p-4 mb-5">

        <h2 class="mb-4">

            ♻ Residuos Recibidos

        </h2>

        <table class="table table-hover">

            <thead>

            <tr>

                <th>ID</th>
                <th>Descripción</th>
                <th>Estado</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="s : ${solicitudes}">

                <td th:text="${s.id}"></td>

                <td th:text="${s.descripcion}"></td>

                <td>

                    <span class="badge bg-success"
                          th:text="${s.estado}">
                    </span>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

    <div class="card p-4">

        <h2 class="mb-4">

            📍 Puntos de Reciclaje

        </h2>

        <table class="table table-striped">

            <thead>

            <tr>

                <th>Nombre</th>
                <th>Dirección</th>
                <th>Horario</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="p : ${puntos}">

                <td th:text="${p.nombre}"></td>

                <td th:text="${p.direccion}"></td>

                <td th:text="${p.horario}"></td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
