<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Ciudadano</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>

        body{
            background:#edf2f7;
        }

        .navbar{
            background:linear-gradient(90deg,#166534,#15803d);
        }

        .navbar-brand{
            color:white;
            font-weight:bold;
            font-size:28px;
        }

        .card{
            border:none;
            border-radius:25px;
            transition:0.4s;
            overflow:hidden;
            box-shadow:0 10px 25px rgba(0,0,0,0.1);
        }

        .card:hover{
            transform:translateY(-10px) scale(1.02);
        }

        .tipo-card{
            background:white;
            padding:20px;
            border-radius:20px;
            text-align:center;
            transition:0.3s;
            font-weight:bold;
        }

        .tipo-card:hover{
            background:#16a34a;
            color:white;
            transform:scale(1.05);
        }

        iframe{
            border-radius:20px;
        }

        .hero{
            background:linear-gradient(135deg,#166534,#22c55e);
            color:white;
            padding:50px;
            border-radius:30px;
        }

        .titulo{
            font-weight:bold;
        }

    </style>

</head>
<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <span class="navbar-brand">

            ♻ EcoReciclaje

        </span>

        <form th:action="@{/logout}" method="post" class="ms-auto">
            <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
        </form>

    </div>

</nav>

<div class="container mt-5">

    <div class="hero mb-5" data-aos="zoom-in">

        <h1 class="display-5">

            Bienvenido Ciudadano 🌎

        </h1>

        <p class="lead">

            Ayuda al planeta reciclando correctamente.

        </p>

    </div>

    <div class="row mb-5">

        <div class="col-md-3">

            <div class="tipo-card">

                📄 PAPEL

            </div>

        </div>

        <div class="col-md-3">

            <div class="tipo-card">

                📦 CARTON

            </div>

        </div>

        <div class="col-md-3">

            <div class="tipo-card">

                🧴 PLASTICOS

            </div>

        </div>

        <div class="col-md-3">

            <div class="tipo-card">

                🍾 VIDRIO

            </div>

        </div>

    </div>

    <div class="row">

        <div class="col-md-6">

            <div class="card p-4 mb-4" data-aos="fade-right">

                <h3 class="mb-4">

                    Crear Solicitud

                </h3>

                <form method="post" action="/crear-solicitud">

                    <div class="mb-3">

                        <label>Descripción</label>

                        <textarea class="form-control"
                                  name="descripcion"></textarea>

                    </div>

                    <div class="mb-3">

                        <label>Google Maps URL</label>

                        <input type="text"
                               class="form-control"
                               placeholder="https://www.google.com/maps/..."
                               name="direccionMaps">

                    </div>

                    <button class="btn btn-success w-100">

                        Crear Solicitud

                    </button>

                </form>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card p-4" data-aos="fade-left">

                <h3>

                    🎥 Aprende a Reciclar

                </h3>

                <iframe width="100%"
                        height="315"
                        src="https://www.youtube.com/embed/YiHTNfKJwAw"
                        allowfullscreen>
                </iframe>

            </div>

        </div>

    </div>

    <div class="card p-4 mt-5" data-aos="fade-up">

        <h2 class="mb-4">

            📍 Puntos de Reciclaje

        </h2>

        <table class="table table-hover">

            <thead>

            <tr>

                <th>Nombre</th>
                <th>Dirección</th>
                <th>Horario</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="p : ${puntos}">

                <td th:text="${p.nombre}"></td>

                <td th:text="${p.direccion}"></td>

                <td th:text="${p.horario}"></td>

            </tr>

            </tbody>

        </table>

    </div>

    <div class="card p-4 mt-5" data-aos="zoom-in">

        <h2 class="mb-4">

            📜 Historial

        </h2>

        <table class="table table-striped">

            <thead>

            <tr>

                <th>ID</th>
                <th>Descripción</th>
                <th>Estado</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="h : ${historial}">

                <td th:text="${h.id}"></td>

                <td th:text="${h.descripcion}"></td>

                <td>

                    <span class="badge bg-success"
                          th:text="${h.estado}">
                    </span>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
    AOS.init({
        duration:1200
    });
</script>

</body>
</html>
